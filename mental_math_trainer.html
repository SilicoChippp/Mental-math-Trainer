<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心算反应训练器</title><style>:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#e9edf5;background:#10141d}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:760px;margin:30px auto}.panel{background:#1b2230;border:1px solid #344052;border-radius:18px;padding:26px;margin-top:18px}h1{font-size:30px;margin-bottom:8px}p,.muted{color:#aebbd0}label{display:block;margin:14px 0 7px}select,input,button{font:inherit;border-radius:9px;padding:12px;border:1px solid #46556d;background:#111824;color:white}select,input{width:100%}button{cursor:pointer;background:#507fe7;border:0;font-weight:600}button.secondary{background:#354258}button:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.ops{display:flex;flex-wrap:wrap;gap:14px}.ops label{display:flex;align-items:center;gap:6px}.ops input{width:auto}.question{text-align:center;font-size:clamp(32px,7vw,58px);font-weight:700;margin:34px 0}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.hidden{display:none}.feedback{min-height:32px;margin:14px 0;font-weight:600}.ok{color:#66d9a4}.bad{color:#ff8f91}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:9px;border-bottom:1px solid #344052}button{margin-top:12px}.hint{font-size:13px} @media(max-width:520px){.grid{grid-template-columns:1fr}body{padding:12px}.panel{padding:18px}}</style></head><body><main><h1>心算反应训练器</h1><p>无限随机出题 · 分难度 · 逐题计时 · 错题回顾 · 本地成绩记录</p><section id="setup" class="panel"><div class="grid"><div><label for="difficulty">难度</label><select id="difficulty"><option value="1">基础：两位数</option><option value="2" selected>进阶：两到三位数</option><option value="3">困难：三位数与复杂运算</option><option value="4">专家：大数、百分比、小数</option><option value="5">极限：四位数与多步骤</option></select></div><div><label for="count">每组题数</label><select id="count"><option>10</option><option selected>20</option><option>30</option><option>50</option><option value="0">无限模式</option></select></div></div><label>运算类型（可多选）</label><div class="ops"><label><input type="checkbox" value="add" checked>加法</label><label><input type="checkbox" value="sub" checked>减法</label><label><input type="checkbox" value="mul" checked>乘法</label><label><input type="checkbox" value="div" checked>除法</label><label><input type="checkbox" value="pct" checked>百分比</label><label><input type="checkbox" value="mix" checked>混合运算</label></div><label><input id="noNegative" type="checkbox" checked style="width:auto"> 避免负数答案</label><div><button id="start">开始训练</button></div><p class="hint">答案最多保留两位小数。除法题保证答案可精确表示，不需要无限循环小数。</p></section><section id="game" class="panel hidden"><div class="stats"><span id="progress"></span><span id="live"></span></div><div id="question" class="question"></div><form id="form"><label for="answer">你的答案</label><input id="answer" type="text" inputmode="decimal" autocomplete="off" placeholder="输入数字后按 Enter" required><button id="submit" type="submit">提交 (Enter)</button></form><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="hidden">下一题 (Enter)</button> <button id="finish" class="secondary">结束并查看成绩</button></section><section id="summary" class="panel hidden"><h2>本组成绩</h2><div id="summaryStats"></div><button id="again">再来一组（新题）</button> <button id="settings" class="secondary">返回设置</button><h3>逐题记录</h3><div style="overflow-x:auto"><table><thead><tr><th>题目</th><th>你的答案</th><th>正确答案</th><th>耗时</th></tr></thead><tbody id="history"></tbody></table></div><p class="hint">成绩仅保存在此浏览器的 localStorage 中，不会上传。</p><div id="previous"></div></section></main><script>
const $=id=>document.getElementById(id),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,choice=a=>a[rand(0,a.length-1)],round=n=>Math.round((n+Number.EPSILON)*100)/100;
let settings,seen=new Set(),q,records=[],startedAt=0,waiting=false,serial=0;
function make(){const d=settings.d,op=choice(settings.ops);let a,b,c,expr,val;const scale=[0,30,150,650,2500,9000][d];const small=[0,12,25,60,120,350][d];
if(op==='add'){a=rand(10,scale);b=rand(10,scale);expr=`${a} + ${b}`;val=a+b}
if(op==='sub'){a=rand(10,scale);b=rand(10,scale);if(settings.positive&&a<b)[a,b]=[b,a];expr=`${a} − ${b}`;val=a-b}
if(op==='mul'){a=rand(3,Math.max(12,Math.floor(scale/5)));b=rand(3,small);expr=`${a} × ${b}`;val=a*b}
if(op==='div'){b=rand(2,Math.max(8,small));val=rand(2,Math.max(15,Math.floor(scale/3)));if(d>=3&&Math.random()<.4)val=val/choice([2,4,5,10]);val=round(val);a=round(b*val);expr=`${a} ÷ ${b}`}
if(op==='pct'){const p=choice(d<=2?[5,10,15,20,25,50,75]:[2.5,5,7.5,12.5,15,17.5,20,25,35,40,60,75]);a=rand(4,Math.max(20,Math.floor(scale/4)))*choice([2,4,10]);expr=`${p}% × ${a}`;val=round(p*a/100)}
if(op==='mix'){a=rand(2,small);b=rand(2,small);c=rand(2,small);const type=rand(0,2);if(type===0){expr=`(${a} + ${b}) × ${c}`;val=(a+b)*c}else if(type===1){expr=`${a} × ${b} + ${c}`;val=a*b+c}else{expr=`${a} × ${b} − ${c}`;val=a*b-c;if(settings.positive&&val<0){expr=`${a} × ${b} + ${c}`;val=a*b+c}}}
return {expr,val:round(val),op}}
function fresh(){let candidate;for(let i=0;i<500;i++){candidate=make();if(!seen.has(candidate.expr)){seen.add(candidate.expr);return candidate}}seen.clear();candidate=make();seen.add(candidate.expr);return candidate}
function show(section){['setup','game','summary'].forEach(id=>$(id).classList.toggle('hidden',id!==section))}
function newQuestion(){q=fresh();serial++;waiting=false;$('question').textContent=q.expr+' = ?';$('answer').value='';$('answer').disabled=false;$('submit').disabled=false;$('form').classList.remove('hidden');$('feedback').textContent='';$('next').classList.add('hidden');$('progress').textContent=`第 ${serial} 题${settings.count?' / '+settings.count:''}`;$('live').textContent=`正确 ${records.filter(r=>r.ok).length} / ${records.length}`;startedAt=performance.now();$('answer').focus()}
function start(){const ops=[...document.querySelectorAll('.ops input:checked')].map(x=>x.value);if(!ops.length){alert('请至少选择一种运算');return}settings={d:+$('difficulty').value,count:+$('count').value,ops,positive:$('noNegative').checked};records=[];serial=0;seen=new Set();show('game');newQuestion()}
$('start').onclick=start;
$('form').onsubmit=e=>{e.preventDefault();if(waiting)return;const raw=$('answer').value.trim().replace(',','.');if(!/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(raw)){$('feedback').textContent='请输入有效数字';return}const given=Number(raw),elapsed=(performance.now()-startedAt)/1000,ok=Math.abs(given-q.val)<1e-7;records.push({...q,given,elapsed,ok});waiting=true;$('feedback').className='feedback '+(ok?'ok':'bad');$('feedback').textContent=ok?`✓ 正确 · ${elapsed.toFixed(1)} 秒`:`✗ 正确答案：${q.val} · ${elapsed.toFixed(1)} 秒`;$('form').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=settings.count&&records.length>=settings.count?'查看成绩 (Enter)':'下一题 (Enter)';$('next').focus()};
function advance(){if(settings.count&&records.length>=settings.count)finish();else newQuestion()}
$('next').onclick=advance;document.addEventListener('keydown',e=>{if(e.key==='Enter'&&waiting&&document.activeElement!==$('next')){e.preventDefault();advance()}});
function finish(){show('summary');const n=records.length,correct=records.filter(r=>r.ok).length,avg=n?records.reduce((s,r)=>s+r.elapsed,0)/n:0;const accurate=records.filter(r=>r.ok),correctAvg=accurate.length?accurate.reduce((s,r)=>s+r.elapsed,0)/accurate.length:0;$('summaryStats').innerHTML=`<p><strong>${correct} / ${n}</strong> 正确 · 正确率 <strong>${n?(correct/n*100).toFixed(1):0}%</strong> · 平均 <strong>${avg.toFixed(2)} 秒/题</strong> · 答对题平均 <strong>${correctAvg.toFixed(2)} 秒</strong></p>`;$('history').replaceChildren();for(const r of records){const tr=document.createElement('tr');for(const value of [r.expr,r.given,r.val,r.elapsed.toFixed(2)+'s']){const td=document.createElement('td');td.textContent=value;tr.append(td)}tr.style.color=r.ok?'':'#ff8f91';$('history').append(tr)}try{const old=JSON.parse(localStorage.getItem('mathSessions')||'[]');old.unshift({date:new Date().toLocaleString(),level:settings.d,correct,n,avg:+avg.toFixed(2)});localStorage.setItem('mathSessions',JSON.stringify(old.slice(0,30)));$('previous').textContent='最近记录：'+old.slice(0,5).map(x=>`${x.date} · 难度${x.level} · ${x.correct}/${x.n} · ${x.avg}s`).join(' | ')}catch(e){$('previous').textContent='本浏览器未开放本地记录存储'}}
$('finish').onclick=finish;$('again').onclick=start;$('settings').onclick=()=>show('setup');
</script></body></html>
